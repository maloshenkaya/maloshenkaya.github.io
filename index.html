<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Максим & Ангелина</title>

  <style>
    :root{
      --bg: #f4f2ed;
      --text: #6f7568;

      /* ВАЖНО: путь к фото (положите фото в repo: assets/photo.jpg) */
      --photo-url: url("assets/photo.jpg");

      --card-radius: 28px;
      --shadow: 0 18px 40px rgba(0,0,0,.10);

      /* ТЗ: меньше вертикального пространства между & и Ангелина */
      --amp-top: 10px;
      --amp-bottom: 2px; /* уменьшайте до 0px если нужно ещё ближе */

      /* ТЗ: цифры под именами сделать ещё больше в 2 раза */
      --date-size: clamp(76px, 12vw, 140px);  /* ОЧЕНЬ крупно */
      --date-track: 0.22em;
    }

    * { box-sizing: border-box; }

    body{
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* если вдруг где-то попали markdown-блоки — не показываем */
    pre, code { display:none !important; }

    .wrap{
      width: min(720px, 92vw);
      padding: 26px 18px 44px;
      text-align: center;
      position: relative;
    }

    .photo-card{
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background-color: #ddd;
      background-image: var(--photo-url);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .names{
      margin-top: 28px;
      line-height: 1;
      letter-spacing: 2px;
    }

    .name{
      margin: 0;
      font-weight: 500;
      font-size: clamp(56px, 8.5vw, 86px);
    }

    .amp{
      font-size: clamp(30px, 4.8vw, 44px);
      line-height: 1;
      margin: var(--amp-top) 0 var(--amp-bottom);
    }

    /* Убираем лишний верхний отступ у второго имени */
    .name.second{
      margin-top: 0;
    }

    /* ДАТА — НЕ ссылка. Даже если кто-то случайно сделает <a>, вид будет как текст */
    .date{
      margin-top: 18px;
      font-size: var(--date-size);
      letter-spacing: var(--date-track);
      line-height: 1;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      user-select: none;
    }

    /* страховка: вдруг дата окажется внутри <a> */
    .date a, a.date{
      color: var(--text) !important;
      text-decoration: none !important;
    }
    a{
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 420px){
      .date{ letter-spacing: 0.18em; }
    }

    /* “пылесос” для случайного мусора, который может оказаться в углу */
    .trash-hide{
      position: fixed !important;
      left: -9999px !important;
      top: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <!-- Фото (фон). НЕ img => не будет "Фото" в углу при ошибке -->
    <section class="photo-card" aria-label="Фотография пары"></section>

    <section class="names" aria-label="Имена и дата">
      <h1 class="name first">Максим</h1>
      <div class="amp">&amp;</div>
      <h2 class="name second">Ангелина</h2>

      <!-- дата НЕ ссылка -->
      <div class="date">29&nbsp;08&nbsp;2026</div>
    </section>
  </main>

  <script>
    // Удаляем мусор типа ```html / ``` который иногда случайно попадает в разметку
    (function removeTopLeftGarbage(){
      const bad = ["```html", "```", "``", "`html"];
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
      const nodes = [];

      while (walker.nextNode()) {
        const n = walker.currentNode;
        const t = (n.nodeValue || "").trim();
        if (!t) continue;
        if (bad.some(x => t.includes(x))) nodes.push(n);
      }

      for (const n of nodes) {
        const cleaned = (n.nodeValue || "")
          .replaceAll("```html","")
          .replaceAll("```","")
          .replaceAll("``","")
          .replaceAll("`html","")
          .trim();

        if (!cleaned) {
          n.parentNode && n.parentNode.removeChild(n);
        } else {
          n.nodeValue = cleaned;
          if (n.parentElement) n.parentElement.classList.add("trash-hide");
        }
      }
    })();
  </script>
</body>
</html>
