<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Максим & Ангелина</title>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0e;
      --text:#e9e6df;
      --sage:#cfd7c4;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x:hidden;
    }

    /* Волны (оригинальный узор, без картинок) */
    body::before{
      content:"";
      position:fixed;
      inset:-80px;
      pointer-events:none;
      opacity:1;
      background:
        radial-gradient(1200px 800px at 18% 20%, rgba(255,255,255,.06), transparent 62%),
        radial-gradient(1000px 700px at 82% 30%, rgba(255,255,255,.05), transparent 60%),
        radial-gradient(1100px 900px at 50% 95%, rgba(255,255,255,.04), transparent 60%),

        /* волны #1 */
        repeating-radial-gradient(
          circle at 12% 28%,
          rgba(255,255,255,.10) 0px,
          rgba(255,255,255,.10) 1px,
          transparent 1px,
          transparent 64px
        ),

        /* волны #2 */
        repeating-radial-gradient(
          circle at 86% 72%,
          rgba(255,255,255,.07) 0px,
          rgba(255,255,255,.07) 1px,
          transparent 1px,
          transparent 68px
        ),

        /* лёгкая дымка */
        repeating-linear-gradient(
          135deg,
          rgba(255,255,255,.010) 0px,
          rgba(255,255,255,.010) 2px,
          transparent 2px,
          transparent 22px
        );
      filter: blur(.15px);
    }

    .wrap{
      position:relative;
      max-width:1100px;
      margin:0 auto;
      padding:28px 20px 60px;
      text-align:center;
    }

    /* ====== ПК: 3 фото ====== */
    .grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:22px;
      align-items:stretch;
      margin-top:10px;
    }

    .ph{
      position:relative;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.45);
    }

    .ph img{
      width:100%;
      aspect-ratio:3/4;
      object-fit:cover;
      display:block;
    }

    /* ===== Заголовок и дата ===== */
    .names{
      margin:34px 0 8px;
      font-family:"Cormorant Garamond", serif;
      font-weight:300;
      font-size:76px;
      letter-spacing:.10em;
      color:var(--sage);
      text-align:center;
    }

    .dateLine{
      font-family:"Cormorant Garamond", serif;
      font-weight:300;
      font-size:18px;
      letter-spacing:.22em;
      color:rgba(233,230,223,.70);
      text-align:center;
    }

    /* ===== МОБИЛЬНЫЙ СЛАЙДЕР ===== */
    .mSlider{ display:none; }

    @media (max-width: 840px){
      .grid{ display:none; }
      .names{ font-size:52px; }
      .dateLine{ font-size:16px; }
    }

    @media (max-width: 840px){
      .mSlider{
        display:block;
        position:relative;
        max-width:520px;
        margin:10px auto 18px;
        border-radius:22px;
        overflow:hidden;
        box-shadow:0 22px 60px rgba(0,0,0,.45);
      }

      .mSlider img{
        width:100%;
        aspect-ratio:3/4;
        object-fit:cover;
        display:block;
        transition:opacity .35s ease;
        opacity:1;
      }
      .mSlider img.fade{ opacity:0; }

      /* тонкие стрелки */
      .mBtn{
        position:absolute;
        top:0;
        bottom:0;
        width:26%;
        border:0;
        background:transparent;
        cursor:pointer;
      }
      .mBtn.left{ left:0; }
      .mBtn.right{ right:0; }

      .mBtn.left::after,
      .mBtn.right::after{
        content:"";
        position:absolute;
        top:50%;
        width:14px;
        height:14px;
        border-top:2px solid rgba(255,255,255,.75);
        border-right:2px solid rgba(255,255,255,.75);
        transform:translateY(-50%) rotate(45deg);
        filter:drop-shadow(0 10px 22px rgba(0,0,0,.7));
        opacity:.95;
      }
      .mBtn.left::after{
        left:18px;
        transform:translateY(-50%) rotate(-135deg);
      }
      .mBtn.right::after{
        right:18px;
        transform:translateY(-50%) rotate(45deg);
      }
      .mBtn:active{ background:rgba(0,0,0,.10); }

      /* ТОЛЬКО ДЛЯ ТЕЛЕФОНА: имена в 3 строки и & меньше/тоньше */
      .names{
        width:100%;
        margin:18px auto 6px;
        letter-spacing:.08em;
      }
      .names .line{
        display:block;
        width:100%;
        text-align:center;
      }
      .names .ampSign{
        display:block;
        font-size:.55em;   /* меньше */
        font-weight:300;   /* тоньше */
        opacity:.9;
        margin:10px 0;
        line-height:1;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- МОБИЛЬНО: один слайд -->
    <div class="mSlider" aria-label="Фотографии">
      <button class="mBtn left" type="button" aria-label="Назад"></button>
      <img id="mImg" src="photo1.jpg" alt="Фото">
      <button class="mBtn right" type="button" aria-label="Вперёд"></button>
    </div>

    <!-- ПК: 3 фото -->
    <div class="grid">
      <div class="ph"><img src="photo1.jpg" alt=""></div>
      <div class="ph"><img src="photo2.jpg" alt=""></div>
      <div class="ph"><img src="photo3.jpg" alt=""></div>
    </div>

    <!-- Имена (по центру) -->
    <h1 class="names">
      <span class="line">Максим</span>
      <span class="line ampSign">&amp;</span>
      <span class="line">Ангелина</span>
    </h1>

    <!-- Дата под именами -->
    <div class="dateLine">29 08 2026</div>

    <!-- RSVP УБРАНО — вы вставите позже -->
  </div>

  <script>
    // Мобильный слайдер: плавно + стрелки + свайп (логика не менялась)
    const slides = [
      {src:"photo1.jpg"},
      {src:"photo2.jpg"},
      {src:"photo3.jpg"}
    ];

    let i = 0;
    const img = document.getElementById("mImg");
    const left = document.querySelector(".mBtn.left");
    const right = document.querySelector(".mBtn.right");

    function render(next){
      i = (next + slides.length) % slides.length;
      if(!img) return;

      img.classList.add("fade");
      setTimeout(() => {
        img.src = slides[i].src;
        img.classList.remove("fade");
      }, 180);
    }

    left?.addEventListener("click", () => render(i - 1));
    right?.addEventListener("click", () => render(i + 1));

    // свайп по фото
    let startX = null;
    img?.addEventListener("touchstart", (e)=> startX = e.touches[0].clientX, {passive:true});
    img?.addEventListener("touchend", (e)=>{
      if(startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if(Math.abs(dx) > 40) render(dx > 0 ? i - 1 : i + 1);
      startX = null;
    }, {passive:true});

    render(0);
  </script>
</body>
</html>
