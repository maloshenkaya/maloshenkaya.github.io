<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Максим & Ангелина</title>

  <style>
    :root{
      --bg: #f4f2ed;
      --text: #6f7568;

      --card-radius: 28px;
      --shadow: 0 18px 40px rgba(0,0,0,.10);

      /* ТЗ: уменьшить вертикальный отступ между & и "Ангелина" */
      --amp-gap-bottom: 4px; /* сделайте 0px если нужно ещё ближе */

      /* ТЗ: цифры под именами увеличить в 2 раза */
      --date-size: clamp(38px, 6.5vw, 64px);
      --date-tracking: 0.28em;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* Лёгкий фон с линиями (как на скрине) */
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background:
        radial-gradient(circle at 20% 10%, transparent 0 64%, rgba(120,120,120,.25) 65% 66%, transparent 67% 100%),
        radial-gradient(circle at 70% 35%, transparent 0 62%, rgba(120,120,120,.22) 63% 64%, transparent 65% 100%),
        radial-gradient(circle at 40% 75%, transparent 0 60%, rgba(120,120,120,.18) 61% 62%, transparent 63% 100%),
        radial-gradient(circle at 85% 80%, transparent 0 66%, rgba(120,120,120,.18) 67% 68%, transparent 69% 100%);
      filter: blur(.2px);
    }

    .wrap{
      width: min(680px, 92vw);
      padding: 26px 18px 40px;
      text-align: center;
    }

    .photo-card{
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #ddd;
      position: relative;
    }

    .photo-card img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: translateZ(0);
    }

    /* Имена */
    .names{
      margin-top: 28px;
      line-height: 1;
      letter-spacing: 2px;
    }

    .name{
      margin: 0;
      font-weight: 500;
      font-size: clamp(56px, 8.5vw, 86px);
    }

    /* Амперсанд */
    .amp{
      margin: 14px 0 var(--amp-gap-bottom); /* ↓ нижний отступ минимальный */
      font-size: clamp(30px, 4.8vw, 44px);
      line-height: 1;
    }

    /* Чтобы "Ангелина" не отъезжала вниз из-за дефолтных margin */
    .name.second{
      margin-top: 0;
    }

    /* Дата (цифры) — в 2 раза больше */
    .date{
      margin-top: 16px;
      font-size: var(--date-size);
      letter-spacing: var(--date-tracking);
      line-height: 1;
      font-weight: 500;
    }

    /* На маленьких экранах чуть уменьшим трекинг, чтобы не ломалось */
    @media (max-width: 420px){
      .date{ letter-spacing: 0.22em; }
    }

    /* Страховка: если вдруг на страницу попадут pre/code как текст — не показываем */
    pre, code{
      display: none !important;
    }

    /* Страховка №2: если вдруг какой-то элемент появится в левом верхнем углу */
    .kill-markdown-garbage{
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="photo-card" aria-label="Фото пары">
      <!-- Замените на ваше фото -->
      <img src="photo.jpg" alt="Фото" />
    </section>

    <section class="names" aria-label="Имена и дата">
      <h1 class="name first">Максим</h1>
      <div class="amp">&amp;</div>
      <h2 class="name second">Ангелина</h2>

      <div class="date">29&nbsp;08&nbsp;2026</div>
    </section>
  </main>

  <script>
    /**
     * "Программа" удаления чёрных букв ```html, если они вдруг оказались
     * текстом в DOM (как на вашем старом скрине).
     *
     * 1) Ищем текстовые узлы, где встречается ```html или просто ```
     * 2) Удаляем их, либо очищаем содержимое
     */
    (function removeMarkdownGarbage(){
      const badPatterns = ["```html", "```"];
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);

      const toClean = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        const t = (node.nodeValue || "").trim();
        if (!t) continue;

        if (badPatterns.some(p => t.includes(p))) {
          toClean.push(node);
        }
      }

      for (const n of toClean) {
        // Если в узле только мусор — удаляем целиком
        const raw = (n.nodeValue || "");
        const cleaned = raw
          .replaceAll("```html", "")
          .replaceAll("```", "")
          .trim();

        if (!cleaned) {
          n.parentNode && n.parentNode.removeChild(n);
        } else {
          n.nodeValue = cleaned;
          // Если это вдруг было в отдельном элементе, прячем контейнер
          if (n.parentElement) n.parentElement.classList.add("kill-markdown-garbage");
        }
      }
    })();
  </script>
</body>
</html>
