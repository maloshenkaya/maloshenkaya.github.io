<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Максим & Ангелина</title>

<!-- Шрифты -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Inter", sans-serif;
  background:#0b0b0e;
  color:#e9e6df;
  text-align:center;
  position:relative;
  overflow-x:hidden;
}

/* Волны */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background:
    repeating-linear-gradient(120deg,
      rgba(255,255,255,.05) 0px,
      rgba(255,255,255,.05) 1px,
      transparent 1px,
      transparent 36px);
}

/* Обёртка */
.wrapper{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

/* Фото — ПК */
.photos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.photos img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:22px;
.ph{
  position:relative;
  border-radius:22px;
  overflow:hidden;
}

.ph img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
}

/* большие цифры поверх фото */
.ph .num{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  font-family:"Cormorant Garamond", serif;
  font-weight:300;
  font-size:140px;
  letter-spacing:.06em;
  color:rgba(255,255,255,.92);
  text-shadow:0 18px 45px rgba(0,0,0,.7);
  pointer-events:none;
  user-select:none;
}
@media(max-width:768px){
  .ph .num{ font-size:110px; bottom:10px; }
}

}

/* Дата */
.date{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-top:12px;
  font-family:"Cormorant Garamond", serif;
  font-size:56px;
  letter-spacing:.12em;
  color:#fff;
}

/* Имена */
h1{
  margin:40px 0 10px;
  font-family:"Cormorant Garamond", serif;
  font-weight:300;
  letter-spacing:.1em;
  color:#cfd7c4;
}

.subtitle{
  opacity:.8;
}

/* ===== МОБИЛЬНЫЙ СЛАЙДЕР ===== */
@media(max-width:768px){

  .photos{
    grid-template-columns:1fr;
    position:relative;
  }

  .photos img{
    display:none;
  }

  .photos img.active{
    display:block;
  }

  .slider-zone{
    position:absolute;
    top:0;
    bottom:0;
    width:50%;
    z-index:10;
  }

  .left{ left:0; }
  .right{ right:0; }

  .date{
    grid-template-columns:1fr;
    font-size:48px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="photos">
    <img src="photo1.jpg" class="active">
    <img src="photo2.jpg">
    <img src="photo3.jpg">

    <div class="slider-zone left" onclick="prev()"></div>
    <div class="slider-zone right" onclick="next()"></div>
  </div>

  <div class="date">
    <div>29</div>
    <div>08</div>
    <div>26</div>
  </div>

  <h1>Максим & Ангелина</h1>
  <div class="subtitle">29 08 2026</div>

</div>

<script>
let index = 0;
const imgs = document.querySelectorAll('.photos img');

function show(i){
  imgs.forEach(img=>img.classList.remove('active'));
  imgs[i].classList.add('active');
}

function next(){
  index = (index + 1) % imgs.length;
  show(index);
}

function prev(){
  index = (index - 1 + imgs.length) % imgs.length;
  show(index);
}
</script>

</body>
</html>
