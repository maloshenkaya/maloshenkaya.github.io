<!doctype html>
<html lang="ru">
<head>
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Максим & Ангелина</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f4ef;     /* светлый фон */
      --text:#2b2b2b;
      --sage:#6f7b6a;   /* цвет имён и даты */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x:hidden;
    }

    /* ====== ВОЛНЫ (много волн, без диагональных полосок) ====== */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      opacity:1;
      background:
        radial-gradient(1200px 800px at 18% 18%, rgba(0,0,0,.05), transparent 60%),
        radial-gradient(1000px 700px at 82% 28%, rgba(0,0,0,.045), transparent 62%),
        radial-gradient(1100px 900px at 50% 95%, rgba(0,0,0,.04), transparent 62%),

        repeating-radial-gradient(
          circle at 16% 22%,
          rgba(0,0,0,.05) 0px,
          rgba(0,0,0,.05) 1px,
          transparent 1px,
          transparent 42px
        ),
        repeating-radial-gradient(
          circle at 78% 26%,
          rgba(0,0,0,.045) 0px,
          rgba(0,0,0,.045) 1px,
          transparent 1px,
          transparent 52px
        ),
        repeating-radial-gradient(
          circle at 55% 80%,
          rgba(0,0,0,.04) 0px,
          rgba(0,0,0,.04) 1px,
          transparent 1px,
          transparent 62px
        );
      filter: blur(.12px);
    }

    .wrap{
      position:relative;
      z-index:1;
      max-width:1100px;
      margin:0 auto;
      padding:28px 20px 60px;
      text-align:center;
    }

    /* ====== ПК: 3 фото ====== */
    .grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:22px;
      align-items:stretch;
      margin-top:10px;
    }

    .ph{
      position:relative;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,.18);
      background: rgba(0,0,0,.06);
    }

    .ph img{
      width:100%;
      aspect-ratio:3/4;
      object-fit:cover;
      display:block;
    }

    /* ====== ЦИФРЫ НА ФОТО (только ПК) ====== */
    .ph .num{
      position:absolute;
      left:50%;
      bottom:-18px;
      transform:translateX(-50%);
      font-family:"Cormorant Garamond", serif;
      font-weight:300;
      font-size:170px;
      letter-spacing:.02em;
      color:rgba(43,43,43,.70);
      text-shadow:0 18px 40px rgba(0,0,0,.12);
      pointer-events:none;
      user-select:none;
      /* УБИРАЕМ ЦИФРЫ С ФОТО ТОЛЬКО НА НОУТЕ */
@media (min-width: 841px){
  .ph .num{
    display: none;
    }

    /* ===== ИМЕНА ===== */
    .names{
     margin: 22px 0 6px;
  font-family: "Cormorant Garamond", serif;
  font-weight: 300;
  font-size: 56px;          /* одинаковый размер для Максим и Ангелина */
  letter-spacing: .10em;
  color: var(--sage);
  text-align: center;
  line-height: 1.0;         /* строки ближе */
    }
   .names .line{
  display: block;
  margin: 0;                /* убираем лишние отступы между строками */
  padding: 0;
}

    /* & — меньше, тоньше и ближе к Ангелина */
.names .amp{
  font-size: 0.46em;        /* меньше чем имена */
  font-weight: 300;
  opacity: .85;
  line-height: 1;
  margin: 2px 0 0;          /* сверху чуть-чуть, снизу почти нет */
  transform: translateY(-0.05em);
}
    /* ДАТА — на 1 размер меньше, гармонично */
.dateLine{
  font-family: "Cormorant Garamond", serif;
  font-weight: 300;
  font-size: 22px;          /* меньше чем имена */
  letter-spacing: .08em;
  color: var(--sage);
  margin-top: 6px;
  text-align: center;
  white-space: nowrap;
}
    }

    /* ===== ДАТА (гармонично под именами) =====
       - тот же шрифт, что и имена
       - размер меньше имён
       - без огромных пробелов
       - точечки вместо пробелов выглядят аккуратнее
    */
    .dateLine{
      font-family:"Cormorant Garamond", serif;
      font-weight:300;
      font-size:26px;
      letter-spacing:.08em;
      color:var(--sage);
      margin: 6px 0 0;
      text-align:center;
      white-space:nowrap;
    }

    /* защита от “синих” авто-ссылок */
    .dateLine, .dateLine a{
      color:var(--sage) !important;
      text-decoration:none !important;
      -webkit-text-fill-color: var(--sage) !important;
    }
    /* ТОЛЬКО ТЕЛЕФОН — ещё плотнее (как на вашем скрине) */
@media (max-width: 840px){
  .names{ font-size: 56px; }
  .names .amp{ margin: 1px 0 0; }  /* ещё ближе к Ангелина */
  .dateLine{ font-size: 21px; }
}

    /* ===== МОБИЛЬНЫЙ СЛАЙДЕР ===== */
    .mSlider{ display:none; }

    @media (max-width: 840px){
      .grid{ display:none; }
      .mSlider{ display:block; }

      .mSlider{
        position:relative;
        max-width:520px;
        margin:10px auto 18px;
        border-radius:22px;
        overflow:hidden;
        box-shadow:0 20px 50px rgba(0,0,0,.18);
        background: rgba(0,0,0,.06); /* чтобы не было "пустоты" если фото не прогрузилось */
      }

      .mSlider img{
        width:100%;
        aspect-ratio:3/4;
        object-fit:cover;
        display:block;
        transition:opacity .35s ease;
        opacity:1;
      }
      .mSlider img.fade{ opacity:0; }

      .mBtn{
        position:absolute;
        top:0;
        bottom:0;
        width:26%;
        border:0;
        background:transparent;
        cursor:pointer;
      }
      .mBtn.left{ left:0; }
      .mBtn.right{ right:0; }

      .mBtn.left::after,
      .mBtn.right::after{
        content:"";
        position:absolute;
        top:50%;
        width:14px;
        height:14px;
        border-top:2px solid rgba(255,255,255,.85);
        border-right:2px solid rgba(255,255,255,.85);
        transform:translateY(-50%) rotate(45deg);
        filter:drop-shadow(0 10px 22px rgba(0,0,0,.35));
        opacity:.95;
      }
      .mBtn.left::after{
        left:18px;
        transform:translateY(-50%) rotate(-135deg);
      }
      .mBtn.right::after{
        right:18px;
        transform:translateY(-50%) rotate(45deg);
      }
      .mBtn:active{ background:rgba(0,0,0,.06); }

      /* телефон: ближе строки */
      .names{
        font-size:56px;
        margin: 22px 0 6px;
        line-height:1.02;
      }
      .names .amp{
        margin: 2px 0;
        font-size:0.52em;
      }

      .dateLine{
        font-size:24px;      /* гармонично под именами */
        letter-spacing:.08em;
        margin-top: 6px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- МОБИЛЬНО: один слайд -->
    <div class="mSlider" aria-label="Фотографии">
      <button class="mBtn left" type="button" aria-label="Назад"></button>
      <img id="mImg" src="photo1.jpg" alt="Фото">
      <button class="mBtn right" type="button" aria-label="Вперёд"></button>
    </div>

    <!-- ПК: 3 фото -->
    <div class="grid">
      <div class="ph">
        <img src="photo1.jpg" alt="">
        <div class="num">29</div>
      </div>
      <div class="ph">
        <img src="photo2.jpg" alt="">
        <div class="num">08</div>
      </div>
      <div class="ph">
        <img src="photo3.jpg" alt="">
        <div class="num">26</div>
      </div>
    </div>

    <h1 class="names">
      <span class="line">Максим</span>
      <span class="line amp">&amp;</span>
      <span class="line">Ангелина</span>
    </h1>

    <!-- Дата: аккуратно, без огромных пробелов -->
    <div class="dateLine">29.08.2026</div>

    <!-- RSVP убрано -->
  </div>

  <script>
    // Мобильный слайдер: плавно + стрелки + свайп
    const slides = [
      {src:"photo1.jpg"},
      {src:"photo2.jpg"},
      {src:"photo3.jpg"}
    ];

    let i = 0;
    const img = document.getElementById("mImg");
    const left = document.querySelector(".mBtn.left");
    const right = document.querySelector(".mBtn.right");

    function render(next){
      i = (next + slides.length) % slides.length;
      if(!img) return;

      img.classList.add("fade");
      setTimeout(() => {
        img.src = slides[i].src;
        img.classList.remove("fade");
      }, 180);
    }

    left?.addEventListener("click", () => render(i - 1));
    right?.addEventListener("click", () => render(i + 1));

    // свайп по фото
    let startX = null;
    img?.addEventListener("touchstart", (e)=> startX = e.touches[0].clientX, {passive:true});
    img?.addEventListener("touchend", (e)=>{
      if(startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if(Math.abs(dx) > 40) render(dx > 0 ? i - 1 : i + 1);
      startX = null;
    }, {passive:true});

    render(0);
  </script>
</body>
</html>
