<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Максим & Ангелина</title>

<style>
body{
  margin:0;
  font-family: "Times New Roman", serif;
  background:#0b0b0b;
  color:#f2f2f2;
}
.wrapper{
  max-width:900px;
  margin:auto;
  padding:20px;
  text-align:center;
}
.photos{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}
.photos div{
  position:relative;
}
.photos img{
  width:100%;
  height:420px;
  object-fit:cover;
  filter:grayscale(100%);
  border-radius:16px;
}
.num{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  font-size:72px;
}
h1{
  margin:20px 0 10px;
  font-size:40px;
}
.date{
  font-size:18px;
  opacity:.8;
}
.section{
  margin-top:40px;
  padding:25px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
}
.section h2{
  margin-top:0;
  font-size:28px;
}
.timeline div{
  display:flex;
  justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.15);
  padding:10px 0;
}
a.button{
  display:inline-block;
  margin-top:15px;
  padding:12px 18px;
  background:#fff;
  color:#000;
  text-decoration:none;
  border-radius:14px;
  font-weight:bold;
}
iframe{
  width:100%;
  height:300px;
  border:0;
  border-radius:14px;
}
@media(max-width:768px){
  .photos{grid-template-columns:1fr}
  .photos img{height:480px}
}
</style>
</head>

<body>
<div class="wrapper">

<div class="photos">
  <div>
    <img src="photo1.jpg">
    <div class="num">26</div>
  </div>
  <div>
    <img src="photo2.jpg">
    <div class="num">08</div>
  </div>
  <div>
    <img src="photo3.jpg">
    <div class="num">26</div>
  </div>
</div>

<h1>Максим & Ангелина</h1>
<div class="date">26 августа 2026</div>

<div class="section">
<h2>дорогие друзья и родные</h2>
<p>Мы будем счастливы разделить с вами самый важный день нашей жизни.</p>
<a class="button" href="#">Подтвердить присутствие</a>
</div>

<div class="section">
<h2>тайминг</h2>
<div class="timeline">
  <div><span>16:00</span><span>Сбор гостей</span></div>
  <div><span>16:30</span><span>Церемония</span></div>
  <div><span>17:30</span><span>Банкет</span></div>
  <div><span>21:00</span><span>Торт</span></div>
</div>
</div>

<div class="section">
<h2>локация</h2>
<iframe src="https://www.google.com/maps?q=Chisinau&output=embed"></iframe>
</div>

</div>
</body>
</html>
