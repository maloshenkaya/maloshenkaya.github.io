<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<title>Максим & Ангелина</title>

<style>
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.45;
  background:
    /* большие круги */
    radial-gradient(900px 520px at 20% 10%, rgba(255,255,255,.08), transparent 60%),
    radial-gradient(900px 520px at 85% 25%, rgba(255,255,255,.06), transparent 60%),
}
.wrapper{
  max-width:1100px;
  margin:0 auto;
  padding:40px 20px;
  text-align:center;
  background:transparent; /* ВАЖНО */
}

}
.photos{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}
.photos div{
  position:relative;
}
.photos img{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:16px;
}
.num{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  font-size:72px;
}
h1{
  margin:20px 0 10px;
  font-family:"Cormorant Garamond", serif;
  font-weight:300;
  font-size:56px;
  letter-spacing:.06em;
  color:#cfd7c4; /* нежно-зелёный как на примере */
}
.date{
  font-size:18px;
  opacity:.8;
}
.section{
  margin-top:40px;
  padding:25px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
}
.section h2{
  margin-top:0;
  font-size:28px;
}
.timeline div{
  display:flex;
  justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.15);
  padding:10px 0;
}
a.button{
  display:inline-block;
  margin-top:15px;
  padding:12px 18px;
  background:#fff;
  color:#000;
  text-decoration:none;
  border-radius:14px;
  font-weight:bold;
}
iframe{
  width:100%;
  height:300px;
  border:0;
  border-radius:14px;
}
@media(max-width:768px){
  .photos{grid-template-columns:1fr}
  .photos img{height:480px}
}
</style>
</head>

<body>
<div class="wrapper">

<div class="photos">
  <div>
    <img src="photo1.jpg">
    <div class="num">29</div>
  </div>
  <div>
    <img src="photo2.jpg">
    <div class="num">08</div>
  </div>
  <div>
    <img src="photo3.jpg">
    <div class="num">26</div>
  </div>
</div>

<h1>Максим & Ангелина</h1>
<div class="date">29 08 2026
</div>

<div class="section">
<h2>дорогие друзья и родные</h2>
<p>Мы будем счастливы разделить с вами самый важный день нашей жизни.</p>
<a class="button" href="#">Подтвердить присутствие</a>
</div>

<div class="section">
<h2>тайминг</h2>
<div class="timeline">
  <div><span>16:00</span><span>Сбор гостей</span></div>
  <div><span>16:30</span><span>Церемония</span></div>
  <div><span>17:30</span><span>Банкет</span></div>
  <div><span>21:00</span><span>Торт</span></div>
</div>
</div>

<div class="section">
<h2>локация</h2>
<iframe src="https://www.google.com/maps?q=Chisinau&output=embed"></iframe>
</div>

</div>
</body>
</html>
